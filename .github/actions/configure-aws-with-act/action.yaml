name: configure-aws-with-act
description: Conditionally configure AWS with act for testing

inputs:
  aws-access-key-id:
    required: false
  aws-secret-access-key:
    required: false
  aws-deploy-role-arn:
    required: false
  aws-region:
    required: true

runs:
  using: composite
  steps:
    - uses: aws-actions/configure-aws-credentials@v5
      if: ${{ env.ACT }}
      with:
        aws-access-key-id: ${{ inputs.aws-access-key-id }}
        aws-secret-access-key: ${{ inputs.aws-secret-access-key }}
        aws-region: ${{ inputs.aws-region }}

    - uses: aws-actions/configure-aws-credentials@v5
      if: ${{ !env.ACT }}
      with:
        role-to-assume: ${{ inputs.aws-deploy-role-arn }}
        aws-region: ${{ inputs.aws-region }}
