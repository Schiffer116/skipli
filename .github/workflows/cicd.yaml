name: cicd
run-name: ${{ github.actor }} is running CI/CD
on: [push, workflow_dispatch]

permissions:
  id-token: write
  contents: read

jobs:
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
          node-version: "26"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: ./.github/actions/configure-aws-with-act
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-deploy-role-arn: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - run: aws sts get-caller-identity

      - name: Look up UI bucket name
        id: ui-bucket
        run: echo "name=$(aws ssm get-parameter --name /skipli/ui-bucket-name --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"

      - run: aws s3 sync ./dist "s3://${{ steps.ui-bucket.outputs.name }}" --delete

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: pipx run cfn-lint infra/*.yaml
