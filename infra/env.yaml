AWSTemplateFormatVersion: "2010-09-09"
Description: "Template for setting up the neccessary environmental variables for Skipli"

Parameters:
  Gmail:
    Type: String
  GmailAppPassword:
    Type: String
    NoEcho: true

Resources:
  AppEmailParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Description: "Gmail to send verification mails"
      Name: "/skipli/app-email"
      Type: String
      Value: !Ref Gmail

  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: "SkipliSecret"
      Description: "Secrets for Skipli"
      GenerateSecretString:
        SecretStringTemplate: !Sub '{"gmailAppPassword": "${GmailAppPassword}"}'
        GenerateStringKey: "jwtSecret"
        PasswordLength: 64
        ExcludePunctuation: true
