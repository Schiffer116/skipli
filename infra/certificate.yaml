AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Skipli's TLS certificate for the site's custom domain. Must be deployed in
  us-east-1: CloudFront only accepts certificates from there.

Parameters:
  DomainName:
    Type: String
    Description: e.g. skipli.schifferarchitecture.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: Route 53 zone the domain lives in, validation record goes here

Resources:
  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

Outputs:
  CertificateArn:
    Value: !Ref Certificate
