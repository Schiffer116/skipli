AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Skipli API - Lambda behind an HTTP API Gateway.

Parameters:
  Gmail:
    Type: String
  GmailAppPassword:
    Type: String
    NoEcho: true
  DomainName:
    Type: String
    Description: e.g. api.skipli.schifferarchitecture.com
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
  CodeBucket:
    Type: String
    Description: Bucket holding the API's Lambda bundle (from artifacts.yaml)
  CodeKey:
    Type: String
    Description: Object key of the API's Lambda bundle (bootstrap in a zip)

Resources:
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: "SkipliSecret"
      Description: "JWT signing secret for Skipli"
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true

  APILambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      Architectures:
        - arm64
      CodeUri:
        Bucket: !Ref CodeBucket
        Key: !Ref CodeKey
      Description: "Skipli's API Lambda Function"
      Environment:
        Variables:
          APP_EMAIL: !Ref Gmail
          APP_EMAIL_PASSWORD: !Ref GmailAppPassword
          JWT_SECRET: "{{resolve:secretsmanager:SkipliSecret:SecretString}}"
      Handler: hello.handler
      LoggingConfig:
        LogFormat: Text
        LogGroup: /aws/lambda/Skipli
      MemorySize: 128
      PackageType: Zip
      RecursiveLoop: Terminate
      Runtime: provided.al2023
      RuntimeManagementConfig:
        UpdateRuntimeOn: Auto
      SnapStart:
        ApplyOn: None
      Tags: {}
      Timeout: 3
      Tracing: PassThrough
      Role: arn:aws:iam::797848269974:role/service-role/Skipli-role-ran0krvh
      Events:
        Api:
          Type: HttpApi

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId

  ApiDomainName:
    Type: AWS::ApiGatewayV2::DomainName
    Properties:
      DomainName: !Ref DomainName
      DomainNameConfigurations:
        - CertificateArn: !Ref Certificate

  ApiMapping:
    Type: AWS::ApiGatewayV2::ApiMapping
    Properties:
      ApiId: !Ref ServerlessHttpApi
      DomainName: !Ref ApiDomainName
      Stage: $default

  DomainRecord:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApiDomainName.RegionalDomainName
        HostedZoneId: !GetAtt ApiDomainName.RegionalHostedZoneId

Outputs:
  ApiUrl:
    Value: !Sub https://${DomainName}
